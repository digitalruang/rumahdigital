        const MathText = ({ text }) => {
            const containerRef = useRef(null);

            useEffect(() => {
                if (!containerRef.current) return;
                let processedText = text || '';
                
                // Replace inline math $...$
                processedText = processedText.replace(/\$([^\$]+)\$/g, (match, formula) => {
                    try {
                        return katex.renderToString(formula, { displayMode: false, throwOnError: false });
                    } catch (e) {
                        return match;
                    }
                });

                // Replace display math $$...$$
                processedText = processedText.replace(/\$\$([^\$]+)\$\$/g, (match, formula) => {
                    try {
                        return katex.renderToString(formula, { displayMode: true, throwOnError: false });
                    } catch (e) {
                        return match;
                    }
                });

                containerRef.current.innerHTML = processedText;
            }, [text]);

            return <span ref={containerRef} className="leading-relaxed whitespace-pre-line inline-block w-full" />;
        };

        const dbService = {
            async initAuth() {
                if (!window.auth) return null;
                return new Promise((resolve) => {
                    window.onAuthStateChanged(window.auth, async (user) => {
                        if (user) {
                            resolve(user);
                        } else {
                            try {
                                const customToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                                let cred;
                                if (customToken) {
                                    cred = await window.signInWithCustomToken(window.auth, customToken);
                                } else {
                                    cred = await window.signInAnonymously(window.auth);
                                }
                                resolve(cred.user);
                            } catch (e) {
                                console.error("Auth init error:", e);
                                resolve(null);
                            }
                        }
                    });
                });

            async loginUser(role, identifier, password) {
                await this.initAuth();
                const usersRef = window.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'users');
                const snap = await window.getDocs(usersRef);
                let found = null;

                    const data = d.data();

                        if (role === 'siswa' && data.fullName?.toLowerCase() === identifier.fullName?.toLowerCase() && data.classId === identifier.classId) {

                        } else if (role === 'guru' && data.nip === identifier.nip) {
                            found = { id: d.id, ...data };
                        }

                if (!found) {
                    if (role === 'siswa' && identifier.fullName === 'Budi Santoso') {
                        found = { id: 's1', fullName: 'Budi Santoso', classId: 'VIII C', absensi: '05', role: 'siswa', password: 'password123', badges: ['Pionir Literasi', 'Bintang TKA'] };

                if (!found) {
                    throw new Error(role === 'siswa' ? 'Nama, kelas, atau password tidak sesuai.' : 'NIP atau password tidak sesuai.');

                return found;
            },

            async registerSiswa(data) {
                await this.initAuth();
                const usersRef = window.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'users');
                const snap = await window.getDocs(usersRef);
                let exists = false;
                snap.forEach(d => {
                    const u = d.data();
                    if (u.role === 'siswa' && u.fullName?.toLowerCase() === data.fullName?.toLowerCase() && u.classId === data.classId) {
                        exists = true;
                    }

                const snap = await window.getDocs(usersRef);
                let exists = false;
                snap.forEach(d => {

                if (exists) throw new Error('Guru dengan NIP tersebut sudah terdaftar.');

                const newUser = { role: 'guru', isVerified: true, createdAt: new Date().toISOString(), ...data };
                const docRef = await window.addDoc(usersRef, newUser);
                return { id: docRef.id, ...newUser };
            },

            async getMaterials(subjectId, requestingClassId) {
                await this.initAuth();
                const materialsRef = window.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'materials');
                const snap = await window.getDocs(materialsRef);
                const cloudMaterials = [];
                snap.forEach(d => cloudMaterials.push({ id: d.id, ...d.data() }));

                const allMaterials = [...DEFAULT_MATERIALS, ...cloudMaterials];
                const studentGrade = requestingClassId ? requestingClassId.split(' ')[0] : null;

                return allMaterials.filter(m => {
                    if (m.subjectId !== subjectId) return false;
                    if (!studentGrade) return true;
                    if (m.classId === `Semua Kelas ${studentGrade}`) return true;
                    return m.classId.split(' ')[0] === studentGrade || m.classId === requestingClassId;
                });
            },

            async addMaterial(newMat) {
                await this.initAuth();
                const materialsRef = window.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'materials');
                const payload = { ...newMat, createdAt: new Date().toISOString() };
                const docRef = await window.addDoc(materialsRef, payload);
                return { id: docRef.id, ...payload };
            }
        };

        const TryOutTKA = () => {
            const [selectedSubject, setSelectedSubject] = useState('matematika');
            const [userAnswers, setUserAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);

            const questions = TRYOUT_TKA_DATA[selectedSubject] || [];

            const handleSingleSelect = (qIdx, optionIdx) => {
                if (submitted) return;
                setUserAnswers({ ...userAnswers, [qIdx]: optionIdx });
            };

            const handleMultipleSelect = (qIdx, optionIdx) => {
                if (submitted) return;
                const current = userAnswers[qIdx] || [];
                const updated = current.includes(optionIdx)
                    ? current.filter(i => i !== optionIdx)
                    : [...current, optionIdx];
                setUserAnswers({ ...userAnswers, [qIdx]: updated });
            };

            const calculateScore = () => {
                let correctCount = 0;
                questions.forEach((q, idx) => {
                    const ans = userAnswers[idx];
                    if (q.type === 'single') {
                        if (ans === q.correctIndex) correctCount++;
                    } else if (q.type === 'multiple') {
                        if (Array.isArray(ans) && 
                            ans.length === q.correctIndices.length && 
                            ans.every(val => q.correctIndices.includes(val))) {
                            correctCount++;
                        }
                    }
                });
                return Math.round((correctCount / questions.length) * 100);
            };

                            <div className="flex items-center justify-between border-b pb-4">
                                <h3 className="text-lg font-bold text-gray-800 uppercase tracking-wide">
                                    Soal TKA {selectedSubject === 'matematika' ? 'Matematika' : 'Bahasa Indonesia'} ({questions.length} Soal)
                                </h3>
                                {submitted && (
                                    <span className="text-sm font-black bg-purple-100 text-purple-800 px-4 py-1.5 rounded-full border border-purple-200">
                                        Skor Akhir: {calculateScore()} / 100
                                    </span>
                                )}
                            </div>

                            {questions.map((q, idx) => (
                                <div key={q.id || idx} className="p-5 sm:p-6 bg-slate-50 rounded-2xl border border-gray-200/80 space-y-4">
                                    <div className="flex items-start justify-between gap-3">
                                        <div className="font-semibold text-gray-800 text-sm sm:text-base leading-relaxed w-full">
                                            <span className="text-purple-600 font-extrabold mr-2">{idx + 1}.</span>
                                            <MathText text={q.question} />
                                        </div>
                                    </div>

                                    <div className="text-xs font-semibold text-purple-600 bg-purple-50 inline-block px-3 py-1 rounded-md border border-purple-100">
                                        {q.type === 'single' ? 'Pilihan Ganda (Pilih 1)' : 'Pilihan Ganda Kompleks (Pilih lebih dari satu)'}
                                    </div>

                                    <div className="grid grid-cols-1 gap-2 pt-2">
                                        {q.options.map((opt, oIdx) => {
                                            const isSelected = q.type === 'single' 
                                                ? userAnswers[idx] === oIdx 
                                                : (userAnswers[idx] || []).includes(oIdx);

                                            let isCorrect = false;
                                            if (q.type === 'single') isCorrect = q.correctIndex === oIdx;
                                            else isCorrect = q.correctIndices?.includes(oIdx);

                                            let style = "border-gray-200 bg-white text-gray-700 hover:bg-gray-100";
                                            if (submitted) {
                                                if (isCorrect) style = "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold";
                                                else if (isSelected && !isCorrect) style = "border-red-500 bg-red-50 text-red-900 font-bold";
                                            } else if (isSelected) {
                                                style = "border-purple-600 bg-purple-50 text-purple-900 font-bold";
                                            }

                                            return (
                                                <button
                                                    key={oIdx}
                                                    onClick={() => q.type === 'single' ? handleSingleSelect(idx, oIdx) : handleMultipleSelect(idx, oIdx)}
                                                    className={`p-3.5 text-left rounded-xl border text-sm transition-all flex items-start gap-3 ${style}`}
                                                >
                                                    <span className={`w-5 h-5 rounded-md flex items-center justify-center text-xs shrink-0 mt-0.5 ${
                                                        isSelected ? 'bg-purple-600 text-white' : 'border border-gray-400 text-gray-500'
                                                    }`}>
                                                        {q.type === 'single' ? String.fromCharCode(65 + oIdx) : (isSelected ? '✓' : '')}
                                                    </span>
                                                    <div className="flex-1">
                                                        <MathText text={opt} />
                                                    </div>
                                                </button>
                                            );
                                        })}
                                    </div>

                                    {submitted && (
                                        <div className="mt-4 p-4 bg-purple-50/80 border border-purple-200 rounded-xl text-xs sm:text-sm text-purple-950 leading-relaxed">
                                            <span className="font-bold block mb-1 text-purple-800"><i className="fas fa-lightbulb mr-1"></i>Pembahasan Soal:</span>
                                            <MathText text={q.explanation} />
                                        </div>
                                    )}
                                </div>
                            ))}

                            {!submitted ? (
                                <Button 
                                    onClick={() => setSubmitted(true)} 
                                    disabled={Object.keys(userAnswers).length === 0} 
                                    className="w-full py-3.5 font-bold !bg-purple-600 hover:!bg-purple-700 text-white"
                                >
                                    Selesaikan Ujian TKA
                                </Button>
                            ) : (
                                <div className="bg-purple-50 border border-purple-200 p-6 rounded-2xl text-center space-y-3">
                                    <div className="text-3xl font-black text-purple-700">Skor Ujian: {calculateScore()} / 100</div>
                                    <p className="text-sm text-purple-900">Pembahasan untuk semua nomor telah ditampilkan di atas.</p>
                                    <Button onClick={() => { setUserAnswers({}); setSubmitted(false); }} variant="outline" className="mx-auto text-sm">
                                        Ulangi Simulasi
                                    </Button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [currentScreen, setCurrentScreen] = useState('landing');
            const [history, setHistory] = useState([]);
            const [toast, setToast] = useState({ message: '', type: 'error' });
            const [logoutModalOpen, setLogoutModalOpen] = useState(false);
            const [viewParams, setViewParams] = useState({});

            const showToast = (message, type = 'error') => {
                setToast({ message, type });
                setTimeout(() => setToast({ message: '', type: 'error' }), 4000);
            };

            const navigate = (screen) => {
                setHistory(prev => [...prev, currentScreen]);
                setCurrentScreen(screen);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const goBack = () => {
                if (history.length > 0) {
                    const prev = history[history.length - 1];
                    setHistory(prevHist => prevHist.slice(0, -1));
                    setCurrentScreen(prev);
                } else {
                    navigate(user ? `dashboard_${user.role}` : 'landing');
                }
            };

            const login = async (role, identifier, password) => {
                const loggedUser = await dbService.loginUser(role, identifier, password);
                setUser(loggedUser);
                navigate(`dashboard_${role}`);
            };

            const logout = () => {
                setUser(null);
                setLogoutModalOpen(false);
                setHistory([]);
                setCurrentScreen('landing');
                showToast("Anda telah keluar dari aplikasi.", "success");
            };

            return (
                <AppStateContext.Provider value={{
                    user, setUser, currentScreen, navigate, goBack, showToast, 
                    login, logout, setLogoutModalOpen, viewParams, setViewParams
                }}>
                    <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800">
                        <Header />
                        <main className="flex-grow">
                            {currentScreen === 'landing' && <LandingPage />}
                            {currentScreen === 'login_siswa' && <LoginSiswa />}
                            {currentScreen === 'login_guru' && <LoginGuru />}
                            {currentScreen === 'register_siswa' && <RegisterSiswa />}
                            {currentScreen === 'register_guru' && <RegisterGuru />}
                            {currentScreen === 'dashboard_siswa' && <DashboardSiswa />}
                            {currentScreen === 'dashboard_guru' && <DashboardGuru />}
                            {currentScreen === 'subjects' && <SubjectsList />}
                            {currentScreen === 'subject_materials' && <SubjectMaterials />}
                            {currentScreen === 'teacher_add_material' && <TeacherAddMaterial />}
                            {currentScreen === 'literacy' && <LiteracyPage />}
                            {currentScreen === 'numeracy' && <NumeracyPage />}
                            {currentScreen === 'achievements' && <AchievementsPage />}
                            {currentScreen === 'profile' && <ProfilePage />}
                            {currentScreen === 'tryout_tka' && <TryOutTKA />}
                        </main>

                        <ConfirmModal
                            isOpen={logoutModalOpen}
                            title="Konfirmasi Keluar"
                            message="Apakah Anda yakin ingin keluar dari akun Rumah Digital Smart Smepsa?"
                            onConfirm={logout}
                            onCancel={() => setLogoutModalOpen(false)}
                        />

                        <Toast message={toast.message} type={toast.type} onClose={() => setToast({ message: '', type: 'error' })} />
                    </div>
                </AppStateContext.Provider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
